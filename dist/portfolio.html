    <title>Portfolio - Faiz's Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- Synchronous: instantly cover screen if returning from project page -->
    <script>
      if (window.location.search.includes("skip=1")) {
        document.documentElement.classList.add("page-returning");
      }
    </script>
    <!-- Synchronous Theme Initialization -->
    <script>
      const savedTheme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
    <script type="module" crossorigin src="/assets/portfolio-Dtr4ReV3.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/data-CRjsNHo0.js">
    <link rel="stylesheet" crossorigin href="/assets/data-DhOPOipl.css">
  </head>

    <!-- Custom Cursor -->
    <div class="cursor-wrapper">
      <div class="cursor"></div>
    </div>

    <!-- Project Hover Preview (Dennis Snellenberg Style) -->
    <div class="project-preview-wrapper">
      <div class="project-preview-img"></div>
      <div class="project-preview-view"><p>View</p></div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-container">
        <a href="/?skip=1" class="logo">FAIZ AZZAHRA.</a>
        <div class="nav-links">

          <a href="/?skip=1#contact" class="hover-target">CONTACT</a>
          <button
            id="theme-toggle"
            class="theme-btn hover-target"
            aria-label="Toggle Theme"
          >
            <svg
              id="theme-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Wrapped for Lenis -->
    <main id="smooth-wrapper">

        <!-- Work Hero Section -->
        <section class="work-page-hero section">
          <div class="container">
            <h1 class="work-hero-title reveal-text">Creating next level <br> digital products</h1>

                <button class="filter-btn hover-target" data-filter="ui-ux">UI/UX Design <sup>0</sup></button>
                <button class="filter-btn hover-target" data-filter="design">Design <sup>0</sup></button>
                <button class="filter-btn hover-target" data-filter="development">Development <sup>0</sup></button>
              </div>
              <div class="portfolio-views">
                <button class="view-btn hover-target" data-view="list" aria-label="List View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
                <button class="view-btn active hover-target" data-view="grid" aria-label="Grid View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Work Grid Section -->
        <section class="work-grid-section section">
          <div class="container">
            <div class="work-grid" id="work-grid">
              <!-- Dynamically populated from data.js via portfolio.js -->
            </div>
            
            <div class="work-list" id="work-list" style="display: none;">
              <div class="exp-list" id="work-list-body">
                <!-- Dynamically populated -->
              </div>
            </div>
          </div>

    <div class="pt-panel"></div>
